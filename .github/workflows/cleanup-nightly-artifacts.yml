name: One-off Cleanup - Nightly VSIX Artifacts

# Deletes old Actions artifacts left behind by the "Nightly Sync & Build"
# workflow (build-hatz-vsix.yaml) from before it started purging its own
# artifacts after publishing each nightly Release. Those VSIX files are
# already permanently attached to their respective Releases, so this is
# safe to run. Only touches artifacts belonging to that one workflow's
# runs — nothing else in the repo is touched.
#
# This workflow is meant to be deleted after it's been run once.

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Nightly Sync & Build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NIGHTLY_WORKFLOW_ID: "251493966"
        run: |
          set -euo pipefail

          echo "Collecting run IDs for workflow $NIGHTLY_WORKFLOW_ID..."
          gh api "repos/$REPO/actions/workflows/$NIGHTLY_WORKFLOW_ID/runs" --paginate \
            -q '.workflow_runs[].id' | sort -u > run_ids.txt
          echo "Found $(wc -l < run_ids.txt) runs for that workflow."

          echo "Collecting all artifacts in the repo..."
          gh api "repos/$REPO/actions/artifacts" --paginate \
            -q '.artifacts[] | "\(.id)\t\(.workflow_run.id)\t\(.size_in_bytes)\t\(.name)"' > all_artifacts.txt
          echo "Found $(wc -l < all_artifacts.txt) artifacts total in the repo."

          CHECKED=0
          DELETED=0
          FREED_BYTES=0
          while IFS=$'\t' read -r ARTIFACT_ID RUN_ID SIZE NAME; do
            CHECKED=$((CHECKED + 1))
            if grep -qx "$RUN_ID" run_ids.txt; then
              echo "Deleting artifact $ARTIFACT_ID ($NAME, run $RUN_ID, ${SIZE} bytes)"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$ARTIFACT_ID"
              DELETED=$((DELETED + 1))
              FREED_BYTES=$((FREED_BYTES + SIZE))
            fi
          done < all_artifacts.txt

          echo ""
          echo "=== Summary ==="
          echo "Checked $CHECKED artifacts across the whole repo."
          echo "Deleted $DELETED artifacts belonging to the Nightly Sync & Build workflow."
          echo "Freed approximately $((FREED_BYTES / 1024 / 1024)) MB."
